<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KidsLab Schaufenster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; width: 100vw; height: 100vh; }
  #stage-wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #stage { position: relative; width: 1920px; height: 1080px; background: #000; transform-origin: center center; overflow: hidden; }
  #dots { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 100; pointer-events: none; }
  .dot { width: 40px; height: 4px; background: rgba(255,255,255,0.25); border-radius: 2px; overflow: hidden; }
  .dot.active::after { content: ''; display: block; height: 100%; background: #fff; width: 0; animation: fill var(--dur,7000ms) linear forwards; }
  .dot.done { background: rgba(255,255,255,0.6); }
  @keyframes fill { from { width: 0; } to { width: 100%; } }
</style>
</head>
<body>

<div id="stage-wrap">
  <div id="stage">
    <div id="dots"></div>
  </div>
</div>

<script src="slides/common.js"></script>
<script src="slides/playful.js"></script>
<script>
  var DURATION_MS = 7000;
  var stage = document.getElementById('stage');
  var dotsEl = document.getElementById('dots');
  var slides = window.PlayfulVariant.slides;
  var idx = 0;
  var paused = false;
  var timer = null;

  // Stage skalieren — transform:none wenn scale=1 (spart Compositing-Layer)
  function fitStage() {
    var vw = window.innerWidth || document.documentElement.clientWidth;
    var vh = window.innerHeight || document.documentElement.clientHeight;
    if (!vw || !vh) return;
    var s = Math.min(vw / 1920, vh / 1080);
    stage.style.transform = (s > 0.999 && s < 1.001) ? 'none' : 'scale(' + s + ')';
  }
  window.addEventListener('resize', fitStage);
  fitStage();

  // Dots einmalig anlegen
  slides.forEach(function() {
    var d = document.createElement('div');
    d.className = 'dot';
    dotsEl.appendChild(d);
  });

  function updateDots(active) {
    Array.from(dotsEl.children).forEach(function(d, i) {
      d.className = 'dot' + (i === active ? ' active' : i < active ? ' done' : '');
      d.style.setProperty('--dur', DURATION_MS + 'ms');
    });
  }

  function showSlide(i) {
    Array.from(stage.children).forEach(function(el) {
      if (el !== dotsEl) stage.removeChild(el);
    });
    var wrap = document.createElement('div');
    wrap.style.cssText = 'position:absolute;inset:0';
    wrap.innerHTML = slides[i]();
    stage.insertBefore(wrap, dotsEl);
    updateDots(i);
  }

  function tick() {
    clearTimeout(timer);
    if (!paused) {
      timer = setTimeout(function() {
        idx = (idx + 1) % slides.length;
        showSlide(idx);
        tick();
      }, DURATION_MS);
    }
  }

  window.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowRight') { idx = (idx + 1) % slides.length; showSlide(idx); tick(); }
    if (e.key === 'ArrowLeft')  { idx = (idx - 1 + slides.length) % slides.length; showSlide(idx); tick(); }
    if (e.key === ' ') { e.preventDefault(); paused = !paused; if (!paused) tick(); }
  });

  // Start: fonts abwarten (max. 2s Timeout für Offline-Betrieb)
  Promise.race([
    document.fonts.ready,
    new Promise(function(r) { setTimeout(r, 2000); })
  ]).then(function() {
    fitStage();
    showSlide(0);
    tick();
  });
</script>

</body>
</html>
