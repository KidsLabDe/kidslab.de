server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ============================================================
    # Externe Redirects (Downloads, Handbuch, etc.)
    # WICHTIG: Diese stehen VOR dem Trailing-Slash-Rewrite,
    # damit /modpack nicht erst zu /modpack/ wird und dann 404 gibt.
    # ============================================================

    # Modpack Downloads (wichtig! — mit und ohne Trailing Slash)
    location ~ ^/modpack/?$ {
        return 301 https://github.com/KidsLabDe/kidslab-modpack/raw/master/modpack_1.8.9.zip;
    }
    location ~ ^/modpack-shader/?$ {
        return 301 https://github.com/KidsLabDe/kidslab-modpack/raw/master/modpack_shader_1.8.9.zip;
    }

    # Handbuch-Redirects (mit und ohne Trailing Slash)
    location ~ ^/handbuch/?$ {
        return 301 https://handbuch.kidslab.de/;
    }
    location ^~ /handbuch/mcreator {
        return 301 https://handbuch.kidslab.de/mcreator-alapaka-ball-minecraft-mod/uebersicht;
    }
    location ~ ^/minecraft-installation/?$ {
        return 301 https://handbuch.kidslab.de/minecraft/allgemeines/installation;
    }
    location ~ ^/turtlecity2/?$ {
        return 301 https://handbuch.kidslab.de/minecraft/turtlecity;
    }

    # Fobizz Tafel
    location ~ ^/tafel/?$ {
        return 307 https://app.fobizz.com/teaching_board/public_screens/bf24a24c-e8c1-4423-9734-dc2c475680b3?token=405108bb72e26e1969a07d271e0113c1;
    }

    # Trailing slash normalisieren
    rewrite ^([^.]*[^/])$ $1/ permanent;

    # ============================================================
    # Alte Root-Level-URLs → neue Pfade
    # ============================================================
    location = /bastelanleitung-heisser-draht-spiel {
        return 301 /selber-machen/bastelanleitung-heisser-draht/;
    }
    location = /der-toast-brot-versuch {
        return 301 /selber-machen/der-toast-brot-versuch/;
    }
    location = /das-flaschen-u-boot {
        return 301 /selber-machen/das-flaschen-u-boot/;
    }
    location = /buerstibot-die-anleitung {
        return 301 /blog/buerstibot-die-anleitung/;
    }
    location = /mcreator {
        return 301 /minecraft/mcreator/;
    }
    location = /scratch {
        return 301 /selber-machen/scratch/;
    }
    location = /tinkercad {
        return 301 /blog/tinkercad/;
    }
    location = /minecraft-und-mods {
        return 301 /minecraft/minecraft-und-mods/;
    }
    location = /onlinekurs-programmieren-lernen-in-minecraft {
        return 301 /minecraft/onlinekurs-programmieren-lernen-in-minecraft/;
    }
    location = /programmieren-in-minecraft-kostenlose-youtube-videos {
        return 301 /minecraft/;
    }
    location = /minecraft-videos {
        return 301 /minecraft/;
    }
    location = /einsatz-von-tinkercad-und-3d-druck-im-unterricht {
        return 301 /blog/einsatz-von-tinkercad-und-3d-druck-im-unterricht/;
    }
    location = /kahoot-quiz-mit-chatgpt-erstellen {
        return 301 /blog/kahoot-quiz-mit-chatgpt-erstellen/;
    }
    location = /robotics-feriencamp-sommerferien-2021-in-augsburg {
        return 301 /blog/robotics-feriencamp-sommerferien-2021-in-augsburg/;
    }
    location = /impressum-2 {
        return 301 /ueber-kidslab/impressum/;
    }
    location = /ueber-mich {
        return 301 /ueber-kidslab/;
    }
    location = /partner {
        return 301 /ueber-kidslab/partner/;
    }
    location = /kosten-und-kursgebuehren-ermaessigung {
        return 301 /ueber-kidslab/kursgebuehren/;
    }
    location = /wie-komme-ich-zum-kidslab {
        return 301 /ueber-kidslab/kontakt/;
    }
    location = /gamespreis {
        return 301 /gameslab/gamespreis/;
    }
    location = /gameslab-1 {
        return 301 /gameslab/;
    }
    location = /gameslab-2024-rueckblick {
        return 301 /gameslab/gamespreis/2024/;
    }
    location = /kidslab-veranstaltet-das-jugendhackt-lab-augsburg {
        return 301 /blog/jugendhackt-2025/;
    }
    location = /willkommen {
        return 301 /;
    }
    location = /news-experimente-anleitungen {
        return 301 /selber-machen/;
    }
    location = /zocken-fuer-die-zukunft-mit-minetest-digitale-zukunftswerkstaetten-gestalten {
        return 301 /demokratie-in-minecraft/;
    }

    # Alte Kategorie-URLs
    location = /category/kurse {
        return 301 /kurse/;
    }

    # ============================================================
    # Kirby Tag/Paginierung URLs → Blog-Hauptseite
    # ============================================================
    location ~ ^/blog/t: {
        return 301 /blog/;
    }
    location ~ ^/blog/page: {
        return 301 /blog/;
    }

    # ============================================================
    # Kirby Ideen-Kategorie-Filter → Selber-Machen
    # ============================================================
    location ~ ^/ideen\?category= {
        return 301 /selber-machen/;
    }

    # ============================================================
    # Alte Kirby Media-URLs → passende neue Seiten
    # (PDFs und Bilder unter /media/pages/ existieren nicht mehr)
    # ============================================================
    location ~ ^/media/pages/ideen/tinkercad {
        return 301 /selber-machen/tinkercad-3d-design/;
    }
    location ~ ^/media/pages/ideen/mcreator {
        return 301 /minecraft/mcreator/;
    }
    location ~ ^/media/pages/ideen/minecraft-turtles {
        return 301 /minecraft/selber-machen/;
    }
    location ~ ^/media/pages/ideen/bastelanleitung-heisser-draht {
        return 301 /selber-machen/bastelanleitung-heisser-draht/;
    }
    location ~ ^/media/pages/ideen/baue-augsburg {
        return 301 /selber-machen/baue-augsburg/;
    }
    location ~ ^/media/pages/ideen/ballon-auto {
        return 301 /selber-machen/ballon-auto/;
    }
    location ~ ^/media/pages/ideen/shitty-robots {
        return 301 /selber-machen/shitty-robots/;
    }
    location ~ ^/media/pages/ideen/ {
        return 301 /selber-machen/;
    }
    location ~ ^/media/pages/blog/ {
        return 301 /blog/;
    }
    location ~ ^/media/ {
        return 301 /;
    }

    # ============================================================
    # Fehlerhafte /https:// URLs (Kirby-Bug)
    # ============================================================
    location ^~ /https: {
        return 301 /;
    }

    # ============================================================
    # Cache-Header für statische Assets
    # ============================================================
    location ~* \.(js|css|woff2?|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location ~* \.(png|jpe?g|webp|avif|gif)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ============================================================
    # Standard-Handling: Hugo generierte statische Dateien
    # (inkl. Hugo-Alias-Redirect-Dateien)
    # ============================================================
    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    # Custom 404
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
