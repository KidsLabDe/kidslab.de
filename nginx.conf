server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ============================================================
    # Alle Redirects (Legacy-URLs, externe Redirects, etc.)
    # ============================================================
    include /etc/nginx/nginx-redirects.conf;

    # Trailing slash normalisieren
    rewrite ^([^.]*[^/])$ $1/ permanent;

    # ============================================================
    # Cache-Header für statische Assets
    # ============================================================
    # Hugo-fingerprinted Assets (Dateiname enthält Content-Hash,
    # z.B. main.min.fcdb7db7...js) -> Dateiname ändert sich bei
    # Content-Änderung, daher unbedenklich 1 Jahr immutable cachen.
    location ~* "\.[0-9a-f]{16,64}\.(js|css)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    # Nicht gehashte JS/CSS/Fonts/Icons (z.B. custom.css, variables.css) -
    # Dateiname bleibt bei Änderungen gleich, daher immer revalidieren
    # (ETag), sonst zeigen Browser bei normalem Reload alte Version an.
    location ~* \.(js|css|woff2?|svg|ico)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location ~* \.(png|jpe?g|webp|avif|gif)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # ============================================================
    # Standard-Handling: Hugo generierte statische Dateien
    # (inkl. Hugo-Alias-Redirect-Dateien)
    # ============================================================
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html $uri/ =404;
    }

    # Custom 404
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
