# --- Pattern-basierte Redirects (WordPress/Kirby Legacy) ---
location ~ ^/buerstibot-\d+ {
    return 301 /blog/buerstibot-die-anleitung/;
}
location ~ ^/author/ {
    return 301 /blog/;
}
location ~ ^/category/ {
    return 301 /kurse/;
}
location ~ "^/\d{4}/\d{2}/" {
    return 301 /blog/;
}
location ~ ^/produkt/ {
    return 301 /;
}
location ~ ^/videos/?$ {
    return 301 /blog/;
}
location ~ ^/kurs/ {
    return 301 /kurse/;
}
location = /kurse/jugendhackt {
    return 301 /blog/;
}

# --- Kirby Tag/Paginierung URLs → Blog-Hauptseite ---
