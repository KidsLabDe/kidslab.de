{{- $id := .Get 0 | default (.Get "id") -}}
{{- $title := .Get "title" | default "YouTube-Video" -}}

<div class="yt-facade" style="position:relative; max-width:720px; margin:1.5rem 0; cursor:pointer; border-radius:0.75rem; overflow:hidden; background:#000; aspect-ratio:16/9;"
  onclick="this.innerHTML='<iframe src=\'https://www.youtube-nocookie.com/embed/{{ $id }}?autoplay=1\' style=\'position:absolute;top:0;left:0;width:100%;height:100%;border:0;\' allow=\'accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture\' allowfullscreen title=\'{{ $title }}\'></iframe>';this.style.cursor='default';"
>
  <picture>
    <source type="image/webp" srcset="https://i.ytimg.com/vi_webp/{{ $id }}/maxresdefault.webp">
    <img
      src="https://i.ytimg.com/vi/{{ $id }}/maxresdefault.jpg"
      alt="{{ $title }}"
      loading="lazy"
      decoding="async"
      style="width:100%; height:100%; object-fit:cover; display:block;"
    />
  </picture>
  <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center;">
    <svg viewBox="0 0 68 48" width="68" height="48" style="filter:drop-shadow(0 2px 8px rgba(0,0,0,0.4));">
      <path d="M66.52 7.74c-.78-2.93-2.49-5.41-5.42-6.19C55.79.13 34 0 34 0S12.21.13 6.9 1.55c-2.93.78-4.63 3.26-5.42 6.19C.06 13.05 0 24 0 24s.06 10.95 1.48 16.26c.78 2.93 2.49 5.41 5.42 6.19C12.21 47.87 34 48 34 48s21.79-.13 27.1-1.55c2.93-.78 4.64-3.26 5.42-6.19C67.94 34.95 68 24 68 24s-.06-10.95-1.48-16.26z" fill="red"/>
      <path d="M45 24 27 14v20" fill="#fff"/>
    </svg>
  </div>
  <noscript>
    <a href="https://www.youtube.com/watch?v={{ $id }}">Video auf YouTube ansehen</a>
  </noscript>
</div>
