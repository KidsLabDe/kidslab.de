{{- $title := .Get "title" | default "Newsletter abonnieren" -}}
{{- $text := .Get "text" | default "Neue Kurse, Workshops und Termine — direkt per E-Mail." -}}

<div class="kidslab-newsletter" style="
  background-color: #eff6ff;
  border-radius: 0.75rem;
  padding: 2rem;
  margin: 1.5rem 0;
  text-align: center;
">
  <h3 style="
    margin: 0 0 0.5rem 0;
    font-size: 1.5rem;
    font-weight: 700;
    color: #1e293b;
  ">{{ $title }}</h3>

  <p style="
    margin-bottom: 1.25rem;
    color: #475569;
    font-size: 1.05rem;
    line-height: 1.6;
  ">{{ $text }}</p>

  <iframe id="rocketem-signup-org_EuBAblFtUKmn"
        src="https://news.kidslab.de/subscribe/org_EuBAblFtUKmn/embed"
        width="100%" height="620" frameborder="0" scrolling="no"
        style="border:none; max-width:500px; display:block; margin: 0 auto;"></iframe>
  <script>
  (function () {
      var frame = document.getElementById("rocketem-signup-org_EuBAblFtUKmn");
      window.addEventListener("message", function (event) {
          if (event.origin !== "https://news.kidslab.de") return;
          if (!event.data || event.data.type !== "rocketem-resize") return;
          var h = parseInt(event.data.height, 10);
          if (h > 0) frame.style.height = h + "px";
      });
  })();
  </script>
</div>

<style>
  .dark .kidslab-newsletter {
    background-color: #1e293b !important;
  }
  .dark .kidslab-newsletter h3 {
    color: #f1f5f9 !important;
  }
  .dark .kidslab-newsletter p {
    color: #cbd5e1 !important;
  }
</style>
