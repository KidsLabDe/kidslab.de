{{ define "main" }}
  <div class='hx:mx-auto hx:flex hextra-max-page-width'>
    {{ partial "sidebar.html" (dict "context" .) }}
    <article class="hx:w-full hx:break-words hx:flex hx:min-h-[calc(100vh-var(--navbar-height))] hx:min-w-0 hx:justify-center hx:pb-8 hx:pr-[calc(env(safe-area-inset-right)-1.5rem)]">
      <main id="content" class="hx:w-full hx:min-w-0 hextra-max-content-width hx:px-6 hx:pt-4 hx:md:px-12">
        <br class="hx:mt-1.5 hx:text-sm" />
        <h1 class="hx:mt-2 hx:text-4xl hx:font-bold hx:tracking-tight hx:text-slate-900 hx:dark:text-slate-100">Alle Tags</h1>
        <div class="hx:mb-8"></div>
        <div style="display:flex; flex-wrap:wrap; gap:0.75rem;">
          {{- range .Pages -}}
            {{- if not (hasPrefix .Title "user://") -}}
            <a href="{{ .RelPermalink }}"
               style="display:inline-flex; align-items:center; gap:0.5rem; padding:0.5rem 1rem; border-radius:2rem; font-size:0.9rem; text-decoration:none; background:#f1f5f9; color:#475569; border:1px solid #e2e8f0; transition:all 0.2s;"
               onmouseover="this.style.background='#2563eb';this.style.color='#fff';this.style.borderColor='#2563eb'"
               onmouseout="this.style.background='#f1f5f9';this.style.color='#475569';this.style.borderColor='#e2e8f0'"
            >{{ .Title }} <span style="opacity:0.6; font-size:0.8rem;">({{ len .Pages }})</span></a>
            {{- end -}}
          {{- end -}}
        </div>
      </main>
    </article>
    <div class="hx:max-xl:hidden hx:h-0 hx:w-64 hx:shrink-0"></div>
  </div>
  <style>
    .dark main a[style*="f1f5f9"] { background:#1e293b !important; color:#94a3b8 !important; border-color:#334155 !important; }
    .dark main a[style*="f1f5f9"]:hover { background:#3b82f6 !important; color:#fff !important; border-color:#3b82f6 !important; }
  </style>
{{ end }}
