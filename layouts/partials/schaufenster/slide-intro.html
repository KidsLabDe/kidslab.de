{{ $s := .s }}{{ $c := .c }}
<div style="position:absolute;inset:0;background:#0066FF;color:#FFF;font-family:system-ui,sans-serif;overflow:hidden">
  <div style="height:100%;padding:80px 100px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between">
    <div style="display:flex;align-items:center;gap:28px">
      <img src="/schaufenster/assets/logo.png" height="110" loading="eager" alt="KidsLab Logo">
      <div>
        <div class="px" style="font-size:72px;line-height:1">KidsLab</div>
        <div style="font-size:24px;opacity:.9;margin-top:8px">Augsburg · seit 2020</div>
      </div>
    </div>
    <div>
      <div class="px" style="font-size:150px;line-height:.95;color:#FFE66D">{{ $s.tagline }}</div>
      <div style="font-size:38px;margin-top:32px;max-width:1400px;line-height:1.3">{{ $s.text | safeHTML }}</div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:flex-end">
      <div class="px" style="font-size:40px">→ kidslab.de</div>
      <div style="font-size:22px;text-align:right;opacity:.85">gemeinnützige gGmbH<br>Maker Education für junge Menschen</div>
    </div>
  </div>
</div>
