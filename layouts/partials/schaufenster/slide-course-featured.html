{{ $s := .s }}
<div style="position:absolute;inset:0;background:{{ $s.bg }};color:{{ $s.fg }};font-family:system-ui,sans-serif;overflow:hidden">
  <div style="position:absolute;inset:0">
    <img src="{{ $s.image }}" style="width:100%;height:100%;object-fit:cover;opacity:.35" loading="eager" alt="{{ $s.title }}">
  </div>
  <div style="position:relative;height:100%;padding:70px 90px 0;box-sizing:border-box">
    <div style="display:flex;justify-content:space-between;align-items:flex-start">
      <div class="px" style="background:{{ $s.accent }};color:{{ $s.bg }};padding:14px 26px;font-size:30px">★ {{ $s.flag }}</div>
      <div class="px" style="font-size:28px;color:{{ $s.accent }}">{{ $s.subtitle }}</div>
    </div>
    <div style="margin-top:40px">
      <div class="px" style="font-size:180px;line-height:.9">{{ $s.title }}</div>
      <div style="font-size:30px;margin-top:20px;max-width:1100px;line-height:1.3;background:rgba(0,0,0,.4);padding:16px 24px;display:inline-block">{{ $s.teaser }}</div>
    </div>
  </div>
  <div style="position:absolute;bottom:70px;left:90px;right:90px;display:flex;gap:48px;align-items:flex-end;border-top:4px solid {{ $s.accent }};padding-top:24px">
    <div>
      <div style="font-size:18px;opacity:.7;letter-spacing:2px;text-transform:uppercase">Alter</div>
      <div class="px" style="font-size:36px;margin-top:6px;white-space:nowrap">{{ $s.age }}</div>
    </div>
    <div>
      <div style="font-size:18px;opacity:.7;letter-spacing:2px;text-transform:uppercase">Termin</div>
      <div class="px" style="font-size:36px;margin-top:6px;white-space:nowrap">{{ $s.when }}</div>
    </div>
    <div style="flex:1"></div>
    {{ if $s.qr }}
    <div style="background:#FFF;padding:12px;display:inline-block;text-align:center;flex-shrink:0">
      <img src="{{ $s.qr }}" width="160" height="160" style="display:block" loading="eager" alt="QR">
      <div class="px" style="color:#0D1B2A;font-size:16px;margin-top:6px">{{ $s.qr_label }}</div>
    </div>
    {{ end }}
  </div>
</div>
