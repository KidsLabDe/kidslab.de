{{ $s := .s }}{{ $c := .c }}
<div style="position:absolute;inset:0;background:{{ $s.bg }};color:#FFF;font-family:system-ui,sans-serif;overflow:hidden">
  <div style="height:100%;padding:80px 100px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between">
    <div>
      <div class="px" style="font-size:36px;color:#FFE66D;margin-bottom:20px">{{ $s.subline }}</div>
      <div class="px" style="font-size:140px;line-height:.9">{{ $s.headline }}</div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr auto auto;gap:40px;align-items:flex-end">
      <div>
        <div style="opacity:.8;font-size:18px;text-transform:uppercase;letter-spacing:2px;margin-bottom:10px">Besuch uns</div>
        <div class="px" style="font-size:30px;line-height:1.2">{{ $c.address }}</div>
        <div style="font-size:20px;margin-top:16px;opacity:.9">📸 Instagram {{ $c.instagram }}</div>
      </div>
      <div>
        <div style="opacity:.8;font-size:18px;text-transform:uppercase;letter-spacing:2px;margin-bottom:10px">Schreib uns</div>
        <div class="px" style="font-size:28px">{{ $c.email }}</div>
        <div class="px" style="font-size:28px;margin-top:6px">{{ $c.phone }}</div>
      </div>
      {{ if $s.qr_whatsapp }}
      <div style="text-align:center">
        <div style="background:#FFF;padding:12px;display:inline-block">
          <img src="{{ $s.qr_whatsapp }}" width="160" height="160" style="display:block" loading="eager" alt="WhatsApp QR">
        </div>
        <div class="px" style="font-size:18px;margin-top:8px;color:#FFE66D">WhatsApp ↑</div>
      </div>
      {{ end }}
      {{ if $s.qr_website }}
      <div style="text-align:center">
        <div style="background:#FFF;padding:12px;display:inline-block">
          <img src="{{ $s.qr_website }}" width="160" height="160" style="display:block" loading="eager" alt="kidslab.de QR">
        </div>
        <div class="px" style="font-size:18px;margin-top:8px;color:#FFE66D">kidslab.de ↑</div>
      </div>
      {{ end }}
    </div>
  </div>
</div>
