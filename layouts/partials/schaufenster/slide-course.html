{{ $s := .s }}
<div style="position:absolute;inset:0;background:{{ $s.bg }};color:{{ $s.fg }};font-family:system-ui,sans-serif;overflow:hidden">
  <div style="display:grid;grid-template-columns:1.1fr 1fr;height:100%">
    <div style="padding:80px;display:flex;flex-direction:column;justify-content:space-between;box-sizing:border-box">
      <div>
        <div class="px" style="font-size:32px;color:{{ $s.accent }};margin-bottom:20px">Kurs 0{{ $s.num }} / 03</div>
        <div class="px" style="font-size:120px;line-height:.9;margin-bottom:24px">{{ $s.title }}</div>
        <div style="font-size:32px;opacity:.85;margin-bottom:40px">{{ $s.subtitle }}</div>
        <div style="font-size:26px;line-height:1.45;max-width:720px">{{ $s.teaser }}</div>
      </div>
      <div>
        <div style="margin-bottom:20px">
          {{ range $s.highlights }}
          <span class="px" style="display:inline-block;padding:10px 22px;background:{{ $s.accent }};color:{{ $s.bg }};font-size:24px;margin-right:12px;margin-bottom:12px;white-space:nowrap">{{ . }}</span>
          {{ end }}
        </div>
        <div style="display:flex;gap:32px;border-top:3px solid {{ $s.fg }};padding-top:24px;align-items:flex-end">
          <div style="flex:1">
            <div style="font-size:16px;opacity:.6;text-transform:uppercase;letter-spacing:2px">Alter</div>
            <div class="px" style="font-size:28px;margin-top:6px;white-space:nowrap">{{ $s.age }}</div>
            <div style="font-size:16px;opacity:.6;text-transform:uppercase;letter-spacing:2px;margin-top:14px">Termin</div>
            <div class="px" style="font-size:28px;margin-top:6px;white-space:nowrap">{{ $s.when }}</div>
          </div>
          {{ if $s.qr }}
          <div style="background:#FFF;padding:12px;display:inline-block;text-align:center;flex-shrink:0">
            <img src="{{ $s.qr }}" width="160" height="160" style="display:block" loading="eager" alt="QR">
            <div class="px" style="color:#0D1B2A;font-size:16px;margin-top:6px">{{ $s.qr_label }}</div>
          </div>
          {{ end }}
        </div>
      </div>
    </div>
    <div style="overflow:hidden">
      <img src="{{ $s.image }}" style="width:100%;height:100%;object-fit:cover" loading="eager" alt="{{ $s.title }}">
    </div>
  </div>
</div>
